<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<meta
  name="theme-color"
  content="#ff6600">

<link
  rel="manifest"
  href="manifest.json">

<title>AIO DIGITAL MALL</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff8f0;
  color:#171717;
}

header{
  background:#111;
  color:white;
  padding:14px 4%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  font-weight:900;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:700;
}

.primary{
  background:#ff6600;
  color:white;
}

.secondary{
  background:#eee;
}

.danger{
  background:#e53935;
  color:white;
}

.hidden{
  display:none!important;
}

main{
  max-width:1200px;
  margin:auto;
  padding:18px;
}

.hero{
  min-height:220px;
  border-radius:18px;
  background:#ff6600 center/cover no-repeat;
  color:white;
  display:grid;
  place-items:center;
  text-align:center;
}

.search{
  width:100%;
  margin:18px 0;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(190px,1fr));
  gap:14px;
}

.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 18px #0001;
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.card-body{
  padding:14px;
}

.card-body button{
  width:100%;
  margin-top:12px;
}

.modal{
  position:fixed;
  inset:0;
  background:#0009;
  display:grid;
  place-items:center;
  padding:20px;
  z-index:500;
}

.modal-box{
  background:white;
  width:min(430px,100%);
  padding:20px;
  border-radius:18px;
}

.modal input{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:10px;
}

.cart{
  position:fixed;
  right:15px;
  bottom:15px;
  width:min(430px,calc(100% - 30px));
  max-height:85vh;
  overflow:auto;
  background:white;
  padding:20px;
  border-radius:18px;
  box-shadow:0 10px 40px #0004;
  z-index:400;
}

.cart-row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.cart-row small{
  display:block;
  color:#777;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translate(-50%,30px);
  opacity:0;
  background:#111;
  color:white;
  padding:12px 18px;
  border-radius:10px;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

</style>

</head>

<body>

<header>

<div class="brand">
🚩 AIO DIGITAL MALL
</div>

<div>

<button
  data-login
  class="primary">
LOGIN
</button>

<button data-cart>
🛒 <span id="cartCount">0</span>
</button>

</div>

</header>

<main>

<div
  id="mainBanner"
  class="hero">

<div>

<h1>AIO DIGITAL MALL</h1>

<p>
All Products • Local Shops • COD
</p>

</div>

</div>

<input
  id="search"
  class="search"
  placeholder="Search products..."
  oninput="searchProducts()">

<h2>
🔥 LOCAL PRODUCTS
</h2>

<div
  id="localProducts"
  class="grid">
</div>

<h2>
🛒 AMAZON DEALS
</h2>

<div
  id="affiliateProducts"
  class="grid">
</div>

<h2>
⚡ FLASH SALE
</h2>

<p>
Ends in:
<b id="timer">03:00:00</b>
</p>

</main>

<div
  id="loginBox"
  class="modal hidden">

<div class="modal-box">

<h2>
Mobile OTP Login
</h2>

<input
  id="phone"
  placeholder="+919876543210">

<button
  class="primary"
  onclick="sendOTP()">
OTP BHEJO
</button>

<input
  id="otp"
  placeholder="OTP">

<button
  class="primary"
  onclick="verifyOTP()">
VERIFY
</button>

<div id="recaptcha"></div>

<button
  data-close-login
  class="secondary">
CLOSE
</button>

</div>

</div>

<div
  id="cartBox"
  class="cart hidden">

<h2>
🛒 Your Cart
</h2>

<div id="cartItems"></div>

<h3>
Total:
₹<span id="cartTotal">0</span>
</h3>

<textarea
  id="address"
  rows="4"
  style="width:100%;padding:10px"
  placeholder="Complete delivery address">
</textarea>

<button
  class="primary"
  onclick="placeOrder()"
  style="width:100%">
PLACE COD ORDER
</button>

<button
  class="secondary"
  onclick="toggleCart(false)"
  style="width:100%;margin-top:8px">
CLOSE
</button>

</div>

<div id="toast" class="toast"></div>

<script
  type="module"
  src="app.js">
</script>

</body>

</html>
