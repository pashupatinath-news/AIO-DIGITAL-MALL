<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#ff6600">
  <link rel="manifest" href="manifest.json">

  <title>AIO DIGITAL MALL</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8f0;
      color: #171717;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #111;
      color: white;
      padding: 14px 4%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .brand {
      font-weight: 900;
      font-size: 20px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 18px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 15px;
      cursor: pointer;
      font-weight: 700;
    }

    .primary {
      background: #ff6600;
      color: white;
    }

    .secondary {
      background: #eeeeee;
      color: #111;
    }

    .danger {
      background: #e53935;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .hero {
      min-height: 220px;
      border-radius: 18px;
      background: #ff6600 center/cover no-repeat;
      display: grid;
      place-items: center;
      text-align: center;
      color: white;
      padding: 20px;
    }

    .hero h1 {
      font-size: 38px;
      margin: 0 0 10px;
    }

    .search {
      width: 100%;
      padding: 14px;
      margin: 18px 0;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
    }

    section {
      margin: 25px 0;
    }

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 18px #0001;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 14px;
    }

    .card-body button {
      width: 100%;
      margin-top: 12px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: #0009;
      display: grid;
      place-items: center;
      padding: 20px;
      z-index: 500;
    }

    .modal-box {
      width: min(430px, 100%);
      background: white;
      border-radius: 18px;
      padding: 20px;
    }

    .modal input,
    .modal textarea,
    .cart textarea {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .modal button {
      margin: 5px 0;
    }

    .cart {
      position: fixed;
      right: 15px;
      bottom: 15px;
      width: min(430px, calc(100% - 30px));
      max-height: 85vh;
      overflow-y: auto;
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 40px #0004;
      z-index: 400;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-row small {
      display: block;
      color: #777;
      margin-top: 3px;
    }

    .flash {
      background: #111;
      color: white;
      padding: 18px;
      border-radius: 15px;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translate(-50%, 30px);
      opacity: 0;
      background: #111;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      z-index: 1000;
      transition: .25s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media(max-width:600px) {
      .brand {
        font-size: 16px;
      }

      .actions span {
        display: none;
      }

      .hero h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">🚩 AIO DIGITAL MALL</div>

  <div class="actions">
    <span id="loginStatus">Guest</span>

    <button
      data-login
      class="primary">
      LOGIN
    </button>

    <button data-cart>
      🛒 <span id="cartCount">0</span>
    </button>

    <button
      id="logoutBtn"
      class="secondary hidden">
      LOGOUT
    </button>
  </div>
</header>

<main>

  <div id="mainBanner" class="hero">
    <div>
      <h1>AIO DIGITAL MALL</h1>
      <p>All Products • Local Shops • COD</p>
    </div>
  </div>

  <input
    id="search"
    class="search"
    placeholder="Search local products..."
    autocomplete="off">

  <section>
    <h2>🔥 LOCAL PRODUCTS</h2>

    <div id="localProducts" class="grid">
      <p>Firebase se products load ho rahe hain...</p>
    </div>
  </section>

  <section>
    <h2>🛒 AMAZON DEALS</h2>

    <div id="affiliateProducts" class="grid">
      <p>Amazon deals load ho rahe hain...</p>
    </div>
  </section>

  <section class="flash">
    <h2>⚡ FLASH SALE</h2>

    <p>
      Ends in:
      <b id="timer">03:00:00</b>
    </p>
  </section>

</main>

<!-- LOGIN -->

<div
  id="loginBox"
  class="modal hidden">

  <div class="modal-box">

    <h2>📱 Mobile OTP Login</h2>

    <input
      id="phone"
      type="tel"
      placeholder="+919876543210">

    <button
      class="primary"
      onclick="sendOTP()">
      OTP BHEJO
    </button>

    <input
      id="otp"
      type="text"
      inputmode="numeric"
      placeholder="OTP">

    <button
      class="primary"
      onclick="verifyOTP()">
      VERIFY
    </button>

    <div id="recaptcha"></div>

    <button
      class="secondary"
      data-close-login
      style="width:100%">
      CLOSE
    </button>

  </div>
</div>

<!-- CART -->

<div
  id="cartBox"
  class="cart hidden">

  <h2>🛒 Your Cart</h2>

  <div id="cartItems">
    Cart khali hai.
  </div>

  <h3>
    Total:
    ₹<span id="cartTotal">0</span>
  </h3>

  <textarea
    id="address"
    rows="4"
    placeholder="Complete delivery address"></textarea>

  <button
    class="primary"
    onclick="placeOrder()"
    style="width:100%">
    📦 PLACE COD ORDER
  </button>

  <button
    class="secondary"
    onclick="toggleCart(false)"
    style="width:100%;margin-top:8px">
    CLOSE
  </button>

</div>

<div id="toast" class="toast"></div>

<script type="module" src="app.js"></script>

</body>
</html>
