<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AIO DIGITAL MALL - TEAM PANEL</title>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#111;
 color:white;
 font-family:Arial;
}

header{
 background:#ff6600;
 padding:15px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.container{
 max-width:1200px;
 margin:auto;
 padding:15px;
}

.panel{
 background:#1d1d1d;
 padding:20px;
 margin-bottom:20px;
 border-radius:15px;
}

input,select,textarea{
 width:100%;
 padding:12px;
 margin:6px 0;
 border:1px solid #444;
 background:#222;
 color:white;
 border-radius:8px;
}

button{
 background:#ff6600;
 color:white;
 border:0;
 padding:11px 15px;
 border-radius:8px;
 font-weight:bold;
 cursor:pointer;
 margin:4px;
}

.danger{
 background:#d00000;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
 gap:15px;
}

.item{
 background:#252525;
 padding:15px;
 border-radius:12px;
}

.item img{
 width:100%;
 height:160px;
 object-fit:cover;
 border-radius:8px;
}

</style>

</head>

<body>

<header>

<strong>🚩 AIO DIGITAL MALL - TEAM</strong>

<div>
<button onclick="location.href='dashboard.html'">
DASHBOARD
</button>

<button onclick="logoutTeam()">
LOGOUT
</button>
</div>

</header>

<div class="container">

<!-- ATTENDANCE -->

<div class="panel">

<h2>📸 DUTY ATTENDANCE</h2>

<input
 type="file"
 id="selfie"
 accept="image/*"
 capture="camera"
>

<button onclick="dutyIn()">
DUTY IN
</button>

<button onclick="dutyOff()">
DUTY OFF
</button>

<p>
Working Hours:
<strong id="workingHours">00:00:00</strong>
</p>

</div>

<!-- SHOP -->

<div class="panel">

<h2>🏪 ADD LOCAL SHOP</h2>

<input
 id="shopName"
 placeholder="Shop Name"
>

<select id="shopCategory">

<option>Hotel & Food</option>
<option>Grocery</option>
<option>Fashion</option>
<option>Electronics</option>
<option>Education</option>
<option>Jewellery</option>
<option>Property</option>
<option>Mobile & AC</option>

</select>

<input
 id="shopPhone"
 placeholder="Shop Phone"
>

<input
 id="shopAddress"
 placeholder="Shop Address"
>

<button onclick="saveShop()">
ADD SHOP
</button>

</div>

<!-- PRODUCT -->

<div class="panel">

<h2>📦 ADD LOCAL PRODUCT</h2>

<input
 id="pName"
 placeholder="Product Name"
>

<input
 id="pPrice"
 type="number"
 placeholder="Price ₹"
>

<input
 id="pPhoto"
 placeholder="Product Image URL"
>

<select id="pCategory">

<option>Hotel & Food</option>
<option>Grocery</option>
<option>Fashion</option>
<option>Electronics</option>
<option>Education</option>
<option>Jewellery</option>
<option>Property</option>
<option>Mobile & AC</option>

</select>

<input
 id="pStock"
 type="number"
 value="1"
 min="0"
 placeholder="Stock"
>

<input
 id="pShopId"
 placeholder="Shop ID (optional)"
>

<button onclick="saveLocalProduct()">
SAVE PRODUCT
</button>

</div>

<!-- AFFILIATE -->

<div class="panel">

<h2>🛒 AMAZON / AFFILIATE PRODUCT</h2>

<input
 id="aName"
 placeholder="Affiliate Product Name"
>

<input
 id="aPrice"
 type="number"
 placeholder="Display Price ₹"
>

<input
 id="aPhoto"
 placeholder="Product Image URL"
>

<input
 id="aLink"
 placeholder="Amazon Product Link"
>

<button onclick="saveAffiliateProduct()">
SAVE AFFILIATE PRODUCT
</button>

</div>

<!-- BANNER -->

<div class="panel">

<h2>🖼️ MAIN BANNER</h2>

<input
 id="bannerUrl"
 placeholder="Banner Image URL"
>

<button onclick="saveBanner()">
SAVE BANNER
</button>

</div>

<!-- ORDERS -->

<div class="panel">

<h2>📦 LIVE COD ORDERS</h2>

<div id="ordersList">
Loading orders...
</div>

</div>

<!-- PRODUCTS -->

<div class="panel">

<h2>🛍️ LIVE PRODUCTS</h2>

<div id="productsList" class="grid">
Loading products...
</div>

</div>

<!-- SHOPS -->

<div class="panel">

<h2>🏪 LIVE SHOPS</h2>

<div id="shopsList" class="grid">
Loading shops...
</div>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="app.js"></script>

<script>
requireTeam();
loadOrders();
loadProducts();
loadShops();
</script>

</body>
</html>
