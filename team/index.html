<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#ff6600"
  >

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <title>AIO DIGITAL MALL - TEAM</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial,sans-serif;
      background: #111;
      color: #fff;
    }

    header {
      background: #ff6600;
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .wrap {
      max-width: 1200px;
      margin: auto;
      padding: 15px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card {
      background: #1d1d1d;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
    }

    button {
      border: 0;
      padding: 11px 15px;
      border-radius: 8px;
      background: #ff6600;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin: 4px;
    }

    button.danger {
      background: #d32f2f;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(auto-fit,minmax(150px,1fr));
      gap: 12px;
    }

    .stat {
      background: #222;
      padding: 18px;
      border-radius: 12px;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      color: #ff8a3d;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .item {
      background: #252525;
      padding: 14px;
      border-radius: 10px;
    }

  </style>

</head>

<body>

<header>

  <div class="top">

    <strong>
      🚩 AIO DIGITAL MALL
    </strong>

    <div>
      <span id="teamUser">
        Guest
      </span>

      <button onclick="teamLogout()">
        Logout
      </button>
    </div>

  </div>

</header>

<div class="wrap">

  <div class="card">

    <h2>
      🔐 Team Login
    </h2>

    <input
      id="teamEmail"
      type="email"
      placeholder="Team Email"
    >

    <input
      id="teamPassword"
      type="password"
      placeholder="Password"
    >

    <button onclick="teamLogin()">
      LOGIN
    </button>

  </div>

  <div id="teamPanel">

    <div class="stats">

      <div class="stat">
        <span>New Orders</span>
        <strong id="newOrders">0</strong>
      </div>

      <div class="stat">
        <span>Total Orders</span>
        <strong id="totalOrders">0</strong>
      </div>

      <div class="stat">
        <span>Products</span>
        <strong id="totalProducts">0</strong>
      </div>

      <div class="stat">
        <span>Shops</span>
        <strong id="totalShops">0</strong>
      </div>

    </div>

    <br>

    <div class="card">

      <h2>
        📦 Quick Operations
      </h2>

      <button
        onclick="window.location.href='dashboard.html'"
      >
        OPEN DASHBOARD
      </button>

      <button
        onclick="window.location.href='dashboard-panel.html'"
      >
        OPEN FULL PANEL
      </button>

      <button
        onclick="window.open('../coustemer/index.html','_blank')"
      >
        CUSTOMER WEBSITE
      </button>

      <button onclick="refreshTeamData()">
        🔄 REFRESH
      </button>

    </div>

  </div>

</div>

<script
  type="module"
  src="./app.js"
></script>

</body>

</html>
