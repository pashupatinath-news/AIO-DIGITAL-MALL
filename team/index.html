<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<link
  rel="manifest"
  href="manifest.json">

<title>AIO DIGITAL MALL — TEAM</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:#eee;
}

header{
  background:#1c1c1c;
  padding:15px 4%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  color:#ff6600;
  font-weight:900;
}

main{
  max-width:1200px;
  margin:auto;
  padding:18px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(230px,1fr));
  gap:15px;
}

.panel{
  background:#1d1d1d;
  border:1px solid #333;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
}

input,
select{
  width:100%;
  padding:12px;
  margin:6px 0;
  background:#111;
  color:white;
  border:1px solid #444;
  border-radius:9px;
}

button{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:700;
}

.primary{
  background:#ff6600;
  color:white;
}

.secondary{
  background:#333;
  color:white;
}

.danger{
  background:#e53935;
  color:white;
}

.hidden{
  display:none!important;
}

.stats{
  font-size:30px;
  font-weight:900;
}

.item{
  padding:14px;
  border-bottom:1px solid #333;
}

.login{
  max-width:420px;
  margin:70px auto;
}

.message{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:
    translate(-50%,30px);
  opacity:0;
  background:#ff6600;
  color:white;
  padding:12px 18px;
  border-radius:10px;
  transition:.25s;
  z-index:1000;
}

.message.show{
  opacity:1;
  transform:
    translate(-50%,0);
}

</style>

</head>

<body>

<header>

<div class="brand">
🚩 AIO DIGITAL MALL — TEAM
</div>

<button
  id="logoutBtn"
  class="secondary">
LOGOUT
</button>

</header>

<div
  id="loginScreen"
  class="login panel">

<h2>
🔐 Team Login
</h2>

<input
  id="teamPhone"
  type="tel"
  placeholder="+919876543210">

<button
  class="primary"
  onclick="sendOTP()">
OTP BHEJO
</button>

<input
  id="teamOTP"
  placeholder="OTP">

<button
  class="primary"
  onclick="verifyOTP()">
VERIFY
</button>

<div id="recaptcha"></div>

</div>

<main
  id="dashboard"
  class="hidden">

<div class="grid">

<div class="panel">
<div
  class="stats"
  id="ordersCount">
0
</div>
Orders
</div>

<div class="panel">
<div
  class="stats"
  id="productsCount">
0
</div>
Products
</div>

<div class="panel">
<div
  class="stats"
  id="shopsCount">
0
</div>
Shops
</div>

</div>

<div class="grid">

<section class="panel">

<h2>
🏪 Add Local Shop
</h2>

<input
  id="shopName"
  placeholder="Shop Name">

<select id="shopCategory">

<option>Hotel & Food</option>
<option>Grocery</option>
<option>Fashion</option>
<option>Electronics</option>
<option>Education</option>
<option>Jewellery</option>
<option>Property</option>
<option>Mobile & AC</option>

</select>

<button
  class="primary"
  onclick="saveShop()">
ADD SHOP
</button>

</section>


<section class="panel">

<h2>
📦 Add Local Product
</h2>

<input
  id="pName"
  placeholder="Product Name">

<input
  id="pPrice"
  type="number"
  placeholder="Price ₹">

<input
  id="pPhoto"
  placeholder="Product Image URL">

<select id="pCategory">

<option>Grocery</option>
<option>Hotel & Food</option>
<option>Fashion</option>
<option>Electronics</option>
<option>Education</option>
<option>Jewellery</option>
<option>Property</option>
<option>Mobile & AC</option>

</select>

<input
  id="pStock"
  type="number"
  value="1"
  min="0"
  placeholder="Stock">

<button
  class="primary"
  onclick="saveProduct()">
SAVE PRODUCT
</button>

</section>


<section class="panel">

<h2>
🛒 Amazon / Affiliate
</h2>

<input
  id="aName"
  placeholder="Affiliate Product Name">

<input
  id="aPrice"
  type="number"
  placeholder="Display Price ₹">

<input
  id="aPhoto"
  placeholder="Product Image URL">

<input
  id="aLink"
  placeholder="Amazon Product Link">

<button
  class="primary"
  onclick="saveAffiliate()">
SAVE AFFILIATE PRODUCT
</button>

</section>


<section class="panel">

<h2>
🖼️ Main Banner
</h2>

<input
  id="bannerUrl"
  placeholder="Banner Image URL">

<button
  class="primary"
  onclick="saveBanner()">
UPDATE BANNER
</button>

</section>

</div>


<section class="panel">

<h2>
📸 Duty Attendance
</h2>

<input
  id="selfie"
  type="file"
  accept="image/*"
  capture="camera">

<br><br>

<button
  class="primary"
  onclick="uploadSelfie()">
DUTY IN
</button>

<button
  class="secondary"
  onclick="dutyOff()">
DUTY OFF
</button>

</section>


<section class="panel">

<h2>
📦 Live COD Orders
</h2>

<div id="ordersList">
Loading orders...
</div>

</section>


<section class="panel">

<h2>
🛍️ Live Products
</h2>

<div id="productsList">
Loading products...
</div>

</section>


<section class="panel">

<h2>
🏪 Live Shops
</h2>

<div id="shopsList">
Loading shops...
</div>

</section>

</main>

<div
  id="message"
  class="message">
</div>

<script
  type="module"
  src="app.js">
</script>

</body>

</html>
