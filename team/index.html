<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIO DIGITAL MALL - TEAM</title>

<link rel="manifest" href="manifest.json">

<style>
body{
 margin:0;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#111;
 color:white;
 font-family:Arial;
}
.box{
 width:90%;
 max-width:420px;
 background:#1d1d1d;
 padding:25px;
 border-radius:15px;
 box-shadow:0 5px 30px #000;
}
input{
 width:100%;
 box-sizing:border-box;
 padding:14px;
 margin:8px 0;
 border-radius:8px;
 border:1px solid #555;
 background:#222;
 color:white;
}
button{
 width:100%;
 padding:13px;
 border:0;
 border-radius:8px;
 background:#ff6600;
 color:white;
 font-weight:bold;
 margin-top:8px;
}
#recaptcha{margin:10px 0}
</style>
</head>

<body>

<div class="box">

<h1>🚩 AIO DIGITAL MALL</h1>
<h2>TEAM LOGIN</h2>

<div id="recaptcha"></div>

<input
 id="phone"
 type="tel"
 placeholder="+919876543210"
>

<button onclick="sendTeamOTP()">
SEND OTP
</button>

<input
 id="otp"
 type="number"
 placeholder="OTP"
>

<button onclick="verifyTeamOTP()">
VERIFY & ENTER
</button>

<p id="status"></p>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="app.js"></script>

</body>
</html>
